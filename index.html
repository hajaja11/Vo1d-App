<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SHOP: DONATE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Roboto:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bs-yellow: #ffcb05;
            --bs-blue: #0066ff;
            --bs-dark-blue: #0044cc;
            --bs-purple: #8e44ad;
            --bs-white: #ffffff;
            --bg-main: #1a1a1a;
        }

        /* Общие стили в стиле Brawl Stars */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-main); 
            color: var(--bs-white);
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, .bs-font { 
            font-family: 'Lilita One', cursive; 
            text-transform: uppercase;
            -webkit-text-stroke: 1px #000;
            text-shadow: 2px 2px 0px #000;
        }

        /* --- ШАПКА --- */
        header {
            background: linear-gradient(180deg, var(--bs-blue) 0%, var(--bs-dark-blue) 100%);
            padding: 20px;
            border-bottom: 5px solid #000;
            display: flex;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #user-photo {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: 3px solid #fff;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3);
        }

        .user-info b { font-size: 18px; display: block; }
        .user-info span { font-size: 12px; color: #add8e6; }

        /* --- КАТЕГОРИИ --- */
        .categories {
            display: flex;
            gap: 10px;
            padding: 15px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .cat-btn {
            background: #333;
            border: 3px solid #000;
            padding: 10px 20px;
            border-radius: 15px;
            color: #fff;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
        }

        .cat-btn.active {
            background: var(--bs-yellow);
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 4px 0 #b38f00;
        }

        /* --- ВИТРИНА --- */
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
            padding-bottom: 100px;
        }

        .product-card {
            background: #2a2a2a;
            border: 4px solid #000;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: 0.2s;
        }

        .product-card:active { transform: scale(0.95); }

        .product-img {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .product-title { font-size: 14px; margin-bottom: 8px; height: 34px; line-height: 1.2; }

        .price-tag {
            background: #27ae60;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 5px;
            font-family: 'Lilita One';
            font-size: 16px;
            box-shadow: 0 3px 0 #1e8449;
        }

        /* --- ОФОРМЛЕНИЕ ЗАКАЗА (MODAL) --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--bs-blue);
            border: 5px solid #000;
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: 3px solid #000;
            border-radius: 15px;
            font-size: 16px;
            outline: none;
        }

        .buy-btn {
            background: var(--bs-yellow);
            color: #000;
            border: 3px solid #000;
            padding: 15px;
            width: 100%;
            border-radius: 15px;
            font-family: 'Lilita One';
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 5px 0 #b38f00;
        }

        /* --- АНИМАЦИЯ --- */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .bounce { animation: bounce 2s infinite; }

    </style>
</head>
<body>

    <header>
        <img id="user-photo" src="https://via.placeholder.com/50" alt="Avatar">
        <div class="user-info">
            <b id="user-name" class="bs-font">PLAYER NAME</b>
            <span>ID: <span id="tg-id">000000</span></span>
        </div>
    </header>

    <div class="categories">
        <button class="cat-btn active" onclick="filter('gems')">ГЕМЫ</button>
        <button class="cat-btn" onclick="filter('pass')">ПАССЫ</button>
        <button class="cat-btn" onclick="filter('offers')">АКЦИИ</button>
    </div>

    <div class="shop-grid" id="shop-items">
        <!-- Товары будут здесь -->
    </div>

    <!-- Модалка заказа -->
    <div id="order-modal" class="modal">
        <div class="modal-content">
            <h2 class="bs-font" id="modal-title">ОФОРМЛЕНИЕ</h2>
            <p style="margin-top: 10px; font-size: 14px;">Для пополнения потребуется код Supercell ID</p>
            
            <input type="text" id="order-email" class="input-field" placeholder="Почта Supercell ID">
            
            <button class="buy-btn" onclick="confirmOrder()">ОПЛАТИТЬ</button>
            <button onclick="closeModal()" style="background:none; border:none; color:#fff; margin-top:15px; text-decoration:underline;">Отмена</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0066ff');

        const user = tg.initDataUnsafe?.user;
        if(user) {
            document.getElementById('user-name').innerText = (user.username || user.first_name).toUpperCase();
            document.getElementById('tg-id').innerText = user.id;
            if(user.photo_url) document.getElementById('user-photo').src = user.photo_url;
        }

        const products = [
            { id: 1, type: 'gems', title: '30 КРИСТАЛЛОВ', price: '199₽', img: 'https://cdn-icons-png.flaticon.com/512/3655/3655513.png' },
            { id: 2, type: 'gems', title: '80 КРИСТАЛЛОВ', price: '449₽', img: 'https://cdn-icons-png.flaticon.com/512/3655/3655513.png' },
            { id: 3, type: 'gems', title: '170 КРИСТАЛЛОВ', price: '899₽', img: 'https://cdn-icons-png.flaticon.com/512/3655/3655513.png' },
            { id: 4, type: 'pass', title: 'BRAWL PASS', price: '699₽', img: 'https://img.api.brawlstars.com/brawlers/16000054/image' },
            { id: 5, type: 'pass', title: 'BRAWL PASS PLUS', price: '999₽', img: 'https://img.api.brawlstars.com/brawlers/16000054/image' },
            { id: 6, type: 'offers', title: 'АКЦИЯ: 10 МЕГАЯЩИКОВ', price: '1299₽', img: 'https://cdn-icons-png.flaticon.com/512/2320/2320875.png' }
        ];

        function renderProducts(filterType) {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';
            
            const filtered = products.filter(p => p.type === filterType);
            
            filtered.forEach(p => {
                container.innerHTML += `
                    <div class="product-card" onclick="openOrder('${p.title}')">
                        <img src="${p.img}" class="product-img bounce">
                        <div class="product-title bs-font">${p.title}</div>
                        <div class="price-tag">${p.price}</div>
                    </div>
                `;
            });
        }

        function filter(type) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts(type);
        }

        let currentProduct = "";

        function openOrder(title) {
            currentProduct = title;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('order-modal').style.display = 'flex';
            tg.HapticFeedback.impactOccurred('medium');
        }

        function closeModal() {
            document.getElementById('order-modal').style.display = 'none';
        }

        function confirmOrder() {
            const email = document.getElementById('order-email').value;
            if(!email.includes('@')) {
                tg.showAlert("Введите корректную почту!");
                return;
            }

            // Имитация отправки данных боту
            const orderData = {
                product: currentProduct,
                email: email,
                user_id: user?.id,
                username: user?.username
            };

            tg.sendData(JSON.stringify(orderData)); 
            // Внимание: sendData работает только если Mini App открыт через кнопку в меню/профиле бота.
            
            tg.showAlert("Заказ сформирован! Оператор свяжется с вами для получения кода подтверждения.");
            closeModal();
        }

        // Стартовый рендер
        renderProducts('gems');
    </script>
</body>
</html>
